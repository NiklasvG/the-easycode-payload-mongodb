name: Quality
on:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      TEST_DATABASE: 'true'
      TEST_MAILPIT: 'true'
      MONGODB_URI: mongodb://127.0.0.1:27017/easycode_test?replicaSet=rs0&directConnection=true
      PAYLOAD_SECRET: ci-only-secret-never-use-in-production
      PREVIEW_SECRET: ci-preview-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      APP_ENV: staging
      EMAIL_TRANSPORT: ''
      SMTP_HOST: 127.0.0.1
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_PORT: '1026'
      GEMINI_API_KEY: ci-no-network-key
      PAYLOAD_UPLOAD_DIR: ./.test-media
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Isolated MongoDB replica set
        run: |
          docker run -d --name mongo-test -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec mongo-test mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Local SMTP inbox
        run: docker run -d --name mail-test -p 127.0.0.1:1026:1025 -p 127.0.0.1:8026:8025 axllent/mailpit@sha256:dffd15d30117bb67e9f4464f6595fc9a40a6b324f99b43236c4d1675b708752e
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:int
      - run: pnpm payload run scripts/seed-test.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Docker build and runtime smoke test
        run: |
          docker build --build-arg NEXT_PUBLIC_SERVER_URL=http://localhost:3000 --build-arg APP_ENV=staging -t easycode-test .
          docker run -d --name app-test --network host --volume "$PWD/.test-media:/app/media:ro" --env MONGODB_URI --env PAYLOAD_SECRET --env PREVIEW_SECRET --env NEXT_PUBLIC_SERVER_URL --env APP_ENV --env EMAIL_TRANSPORT --env SMTP_HOST --env SMTP_USER --env SMTP_PASS --env SMTP_PORT --env GEMINI_API_KEY easycode-test
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs app-test
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Container logs
        if: failure()
        run: docker logs mongo-test; docker logs app-test || true



