name: Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

env:
  CI: 'true'
  TEST_DATABASE: 'true'
  TEST_MAILPIT: 'true'
  MONGODB_URI: mongodb://127.0.0.1:27017/easycode_test?replicaSet=rs0&directConnection=true
  PAYLOAD_SECRET: ci-only-secret-never-use-in-production
  PREVIEW_SECRET: ci-preview-secret
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000
  APP_ENV: staging
  SOURCE_COMMIT: ${{ github.sha }}
  AI_CHAT_ENABLED: 'false'
  EMAIL_TRANSPORT: ''
  SMTP_HOST: 127.0.0.1
  SMTP_USER: ''
  SMTP_PASS: ''
  SMTP_PORT: '1026'
  PAYLOAD_UPLOAD_DIR: ./.test-media

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:deployment

  container:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: container-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Isolated MongoDB replica set
        run: |
          docker run -d --name mongo-test -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec mongo-test mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Local SMTP inbox
        run: docker run -d --name mail-test -p 127.0.0.1:1026:1025 -p 127.0.0.1:8026:8025 axllent/mailpit@sha256:dffd15d30117bb67e9f4464f6595fc9a40a6b324f99b43236c4d1675b708752e
      - name: Require isolated test services
        run: node --input-type=module -e "import { assertTestEnvironment } from './scripts/assert-test-environment.mjs'; assertTestEnvironment(process.env)"
      - run: pnpm test:int
      - run: pnpm payload run scripts/seed-test.ts
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host
      - name: Build the test image once
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: easycode-test:ci
          network: host
          allow: network.host
          no-cache-filters: builder
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SERVER_URL=http://localhost:3000
            APP_ENV=staging
          secret-envs: |
            MONGODB_URI=MONGODB_URI
            PAYLOAD_SECRET=PAYLOAD_SECRET
      - name: Start and check container
        run: |
          sudo chown -R 1001:1001 .test-media
          docker run -d --name app-test --network host --volume "$PWD/.test-media:/app/media" --env MONGODB_URI --env PAYLOAD_SECRET --env PREVIEW_SECRET --env NEXT_PUBLIC_SERVER_URL --env APP_ENV --env SOURCE_COMMIT --env AI_CHAT_ENABLED --env EMAIL_TRANSPORT --env SMTP_HOST --env SMTP_USER --env SMTP_PASS --env SMTP_PORT easycode-test:ci
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 5 http://localhost:3000/api/health/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs app-test
          exit 1
      - run: pnpm exec playwright install --with-deps chromium
      - name: Required browser tests against the container
        env:
          PLAYWRIGHT_EXTERNAL_SERVER: 'true'
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Container logs on failure
        if: failure()
        run: |
          for container in mongo-test mail-test app-test; do
            docker logs --tail 100 "$container" || true
          done
      - name: Remove test containers
        if: always()
        run: docker rm -f app-test mail-test mongo-test || true

  quality:
    name: Quality gate
    needs: [checks, container]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every check
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: test "$CHECKS_RESULT" = success && test "$CONTAINER_RESULT" = success

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.COOLIFY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    concurrency:
      group: coolify-main
      cancel-in-progress: false
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Deploy the verified commit and wait for readiness
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOY_PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-coolify.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: deployment-record
          path: deployment-record.json
          retention-days: 90
